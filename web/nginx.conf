server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Documents are uploaded through this server; the API sets no limit of its own yet.
    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The browser talks to /api; nginx forwards it to the API container, so there is no CORS to
    # configure. The trailing slash in proxy_pass removes the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Answers stream as Server-Sent Events: send every token as soon as it arrives, and
        # give a slow local model plenty of time.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed file names, safe to cache for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
