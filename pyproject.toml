[project]
name = "vectornote"
version = "0.1.0"
description = "Offline RAG study assistant: FastAPI backend, Next.js frontend, local LLMs via Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
vectornote = "vectornote.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.1",
    "flake8-pyproject>=1.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectornote"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
